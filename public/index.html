<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminous Journey</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d14;
      color: #f0ece4;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 28px;
      letter-spacing: 6px;
      color: #e8b86d;
      margin-bottom: 8px;
    }
    .sub { font-size: 12px; color: #ffffff44; letter-spacing: 3px; margin-bottom: 48px; }
    .card {
      background: #12121e;
      border: 1px solid #ffffff1a;
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 13px; letter-spacing: 3px; color: #ffffff55; margin-bottom: 20px; }
    .row { display: flex; gap: 12px; }
    input {
      flex: 1;
      background: #0d0d14;
      border: 1px solid #ffffff22;
      border-radius: 4px;
      color: #f0ece4;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 10px 14px;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #e8b86d88; }
    button {
      background: #e8b86d22;
      border: 1px solid #e8b86d66;
      border-radius: 4px;
      color: #e8b86d;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #e8b86d33; }
    .result {
      margin-top: 16px;
      font-size: 13px;
      color: #74d4a5;
      letter-spacing: 1px;
      min-height: 20px;
    }
    .result.err { color: #d47474; }
    .saves-list { margin-top: 20px; }
    .save-item {
      border: 1px solid #ffffff0d;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #ffffff88;
    }
    .save-item strong { color: #e8b86d; font-size: 14px; }
  </style>
</head>
<body>
  <h1>LUMINOUS</h1>
  <p class="sub">JOURNEY SYSTEM</p>

  <div class="card">
    <h2>CODE GENERATE</h2>
    <button onclick="generateCode()">새 코드 발급</button>
    <div class="result" id="gen-result"></div>
  </div>

  <div class="card">
    <h2>JOURNEY LOOKUP</h2>
    <div class="row">
      <input id="lookup-code" placeholder="16자리 코드 입력" maxlength="16"/>
      <button onclick="lookupJourney()">조회</button>
    </div>
    <div class="result" id="lookup-result"></div>
    <div class="saves-list" id="saves-list"></div>
  </div>

  <script>
    async function generateCode() {
      const el = document.getElementById('gen-result');
      el.className = 'result';
      el.textContent = '생성 중…';
      try {
        const r = await fetch('/api/generate-code', { method: 'POST' });
        const d = await r.json();
        if (d.code) {
          el.textContent = '발급 완료: ' + d.code;
        } else {
          el.className = 'result err';
          el.textContent = d.error || '오류 발생';
        }
      } catch {
        el.className = 'result err';
        el.textContent = '네트워크 오류';
      }
    }

    async function lookupJourney() {
      const code = document.getElementById('lookup-code').value.trim().toUpperCase();
      const res  = document.getElementById('lookup-result');
      const list = document.getElementById('saves-list');
      res.className = 'result';
      res.textContent = '조회 중…';
      list.innerHTML = '';
      try {
        const r = await fetch('/api/journey?code=' + encodeURIComponent(code));
        const d = await r.json();
        if (!r.ok) {
          res.className = 'result err';
          res.textContent = d.error || '오류';
          return;
        }
        const saves = d.saves || [];
        res.textContent = `저장 ${saves.length}건 / CG ${(d.cg || []).length}개 언락`;
        list.innerHTML = saves.map(s => `
          <div class="save-item">
            <strong>Day ${s.day_curr}</strong>
            &nbsp;·&nbsp;${s.time_of_day || '—'}
            &nbsp;·&nbsp;${s.loc || '—'}
            <br>
            <span style="color:#ffffff44">${s.saved_at ? s.saved_at.slice(0,16).replace('T',' ') : ''}</span>
          </div>
        `).join('');
      } catch {
        res.className = 'result err';
        res.textContent = '네트워크 오류';
      }
    }
  </script>
</body>
</html>
